# Gitleaks configuration: the default rules, plus private network addresses.
# A LAN address in a public repository maps out a home or office network, so
# keep real addresses in app/.env (gitignored). For examples use the RFC 5737
# documentation ranges 192.0.2.x, 198.51.100.x or 203.0.113.x, or a placeholder.

[extend]
useDefault = true

[[rules]]
id = "private-ipv4-address"
description = "Private network (RFC 1918) IPv4 address"
regex = '''\b(?:10\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])|192\.168)\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "172.", "192.168."]

[[rules.allowlists]]
description = "Source data and bundled third-party files, not addresses"
paths = ['''\.csv$''', '''\.woff2$''', '''htmx\.min\.js$''']
