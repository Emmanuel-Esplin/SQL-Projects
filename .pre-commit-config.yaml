# Local checks before each commit. Install once:
#   diamond_company/app/.venv/bin/pip install -r diamond_company/app/requirements-dev.txt
#   diamond_company/app/.venv/bin/pre-commit install
# CI runs the same ruff rules, plus gitleaks over the full history.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=4000"]  # the raw Kaggle CSV is 2.8 MB
      - id: check-merge-conflict
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        files: ^(diamond_company/app/|\.github/)
      - id: trailing-whitespace
        files: ^(diamond_company/app/|\.github/)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        files: ^diamond_company/app/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
